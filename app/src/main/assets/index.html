<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');
const WW=900,WH=600,OX=30,OY=130,SY=0.6,DH=30;
function rr(x,y,w,h,r){
 if(r===undefined)r=8;
 if(typeof r==='number')r={tl:r,tr:r,br:r,bl:r};
 g.beginPath();
 g.moveTo(x+r.tl,y);
 g.lineTo(x+w-r.tr,y);
 g.quadraticCurveTo(x+w,y,x+w,y+r.tr);
 g.lineTo(x+w,y+h-r.br);
 g.quadraticCurveTo(x+w,y+h,x+w-r.br,y+h);
 g.lineTo(x+r.bl,y+h);
 g.quadraticCurveTo(x,y+h,x,y+h-r.bl);
 g.lineTo(x,y+r.tl);
 g.quadraticCurveTo(x,y,x+r.tl,y);
 g.closePath();
}
function fillRoundRect(x,y,w,h,r,col){
 g.save();g.fillStyle=col;rr(x,y,w,h,r);g.fill();g.restore();
}
function strokeRoundRect(x,y,w,h,r,col,lw){
 g.save();g.strokeStyle=col;g.lineWidth=lw||1.5;rr(x,y,w,h,r);g.stroke();g.restore();
}
function drawCard(x,y,w,h,r,bgCol,borderCol,lw){
 rr(x,y,w,h,r);
 if(bgCol){g.fillStyle=bgCol;g.fill()}
 if(borderCol){g.strokeStyle=borderCol;g.lineWidth=lw||1.5;g.stroke()}
}
const P=(x,y,z=0)=>{if(!T3)return[x+OX,y*SY+OY-z];const v=T3.v.set(x*.1,z*.1,y*.1).project(T3.cam);if(v.z>1)return[-999,-999];return[(v.x+1)*480,(1-v.y)*260]};
const keys={up:0,down:0,left:0,right:0,nitro:0};
const map={Shift:'nitro',n:'nitro',N:'nitro',ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'};
let state='home',score=0,time=45,bumps=0,bumpCd=0,best=0,msg='';
let playerName='Jaihari21';try{playerName=localStorage.getItem('rcPlayerName')||'Jaihari21'}catch(e){}
let homeModal=null,homeHover=null;
const homeBgImg=new Image();let homeBgOK=false;homeBgImg.onload=()=>homeBgOK=true;homeBgImg.src='home_bg.jpg';
const avatarImg=new Image();let avatarOK=false;avatarImg.onload=()=>avatarOK=true;avatarImg.src='avatar.png';
const homeMotes=Array.from({length:18},()=>({x:Math.random()*960,y:Math.random()*520,sz:1+Math.random()*2,vy:.15+Math.random()*.25,seed:Math.random()*10,alpha:.2+Math.random()*.35}));
try{best=+localStorage.getItem('rcBest')||0}catch(e){}
let desks=[];buildDesks(0);
const car={x:450,y:560,a:-Math.PI/2,v:0,r:8};
let level=1,diff=1,combo=0,comboT=0,shake=0,skids=[],powers=[],clutter=[],pTimer=5,collected=0,steerA=0,popups=[],tops=[];
try{tops=JSON.parse(localStorage.getItem('rcTop')||'[]')}catch(e){}
const DIFF=[{n:'Easy',t:120,s:.85},{n:'Normal',t:120,s:1},{n:'Hard',t:120,s:1.2}];
const ui={diff:false,dy:0,py:0,my:-99};
let NG=false,NH=false,peer=null,hostConn=null,conns=[],remote={},room='',netStatus='',myId='',nAcc=0;
let senseiMode=false,senseiPlayerId='',isSensei=false,senseiStamina=100,senseiCaught=0,senseiShoutCd=0;
car.latV=0;car.drift=0;car.pitch=0;car.roll=0;car.wobble=0;
let AC=null,eng=null,muted=false;
function goLand(){if(!matchMedia('(pointer:coarse)').matches)return;try{const d=document.documentElement;Promise.resolve(d.requestFullscreen&&d.requestFullscreen()).then(()=>screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape')).catch(()=>{})}catch(e){}}
let MG=null,NB=null,sq=null,nit=null,lastTick=-1,gearP=0;
function nz(f,q,type){const s=AC.createBufferSource();s.buffer=NB;s.loop=true;const fl=AC.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;const g=AC.createGain();g.gain.value=0;s.connect(fl);fl.connect(g);g.connect(MG);s.start();return{g,fl}}
function audioInit(){if(AC){AC.resume&&AC.resume();return}try{
 AC=new(window.AudioContext||window.webkitAudioContext)();
 const cp=AC.createDynamicsCompressor();MG=AC.createGain();MG.gain.value=.9;MG.connect(cp);cp.connect(AC.destination);
 NB=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 const o1=AC.createOscillator(),o2=AC.createOscillator(),o3=AC.createOscillator(),lp=AC.createBiquadFilter(),gn=AC.createGain();
 o1.type='sawtooth';o2.type='square';o3.type='sawtooth';lp.type='lowpass';lp.Q.value=4;gn.gain.value=0;
 [o1,o2,o3].forEach(o=>{o.connect(lp);o.start()});lp.connect(gn);gn.connect(MG);eng={o1,o2,o3,lp,gn};
 sq=nz(2500,.3,'bandpass');nit=nz(500,.8,'bandpass')}catch(e){}}
function tone(f,d=.12,type='sine',vol=.15,f2,delay=0){if(!AC||muted)return;const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+delay;
 o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
 g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(MG);o.start(t);o.stop(t+d+.02)}
function nburst(f,f2,d,type,vol,delay=0,pan=0){if(!AC||muted)return;const s=AC.createBufferSource();s.buffer=NB;const fl=AC.createBiquadFilter(),g=AC.createGain(),t=AC.currentTime+delay;
 fl.type=type;fl.frequency.setValueAtTime(f,t);fl.frequency.exponentialRampToValueAtTime(f2,t+d);fl.Q.value=1.2;
 g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl);fl.connect(g);let o=g;if(pan&&AC.createStereoPanner){const pn=AC.createStereoPanner();pn.pan.value=pan;g.connect(pn);o=pn}o.connect(MG);s.start(t,Math.random());s.stop(t+d+.05)}
const sfx={
 pick:()=>{tone(988,.12,'triangle',.16,1318);tone(1480,.18,'sine',.12,1976,.07)},
 bump:()=>{nburst(900,120,.25,'lowpass',.5);tone(110,.25,'sine',.35,45)},
 power:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.18,'triangle',.16,null,i*.07)),
 alert:()=>{tone(1800,.3,'sine',.12,2400);tone(1800,.3,'sine',.12,2400,.35)},
 nitro:()=>{nburst(300,3500,.7,'bandpass',.5);tone(90,.7,'sawtooth',.14,260)},
 catchSfx:()=>{tone(160,.25,'sawtooth',.35,80);nburst(1600,200,.3,'bandpass',.4);[520,392,261].forEach((f,i)=>tone(f,.16,'square',.14,null,i*.07))},
 whack:()=>{nburst(2200,280,.14,'bandpass',.4);tone(340,.12,'sawtooth',.22,90)},
 tick:()=>tone(1200,.04,'square',.06),backfire:()=>[0,.06,.13].forEach(t=>nburst(1200,300,.05,'bandpass',.25,t)),
 bell:()=>[0,.6,1.2,1.8].forEach(t=>[[880,.5],[1320,.3],[2090,.2],[2960,.12]].forEach(([f,v])=>tone(f,1.1,'sine',v*.18,null,t)))};
function engine(){if(!eng||!AC)return;const on=state==='play'&&!muted,v=Math.abs(car.v),gear=Math.min(5,Math.floor(v/1.1)),r=Math.min(1,(v-gear*1.1)/1.1),
 thr=(keys.up||nitroOn)?1:.35,f=48+gear*6+r*(70+gear*4)+(nitroOn?25:0),t=AC.currentTime;
 if(gear!==gearP){if(gear>gearP&&on&&v>.5)nburst(500,200,.12,'lowpass',.08);gearP=gear}
 eng.o1.frequency.setTargetAtTime(f,t,.05);eng.o2.frequency.setTargetAtTime(f/2,t,.05);eng.o3.frequency.setTargetAtTime(f*1.5,t,.05);
 eng.lp.frequency.setTargetAtTime(350+f*8*thr,t,.05);eng.gn.gain.setTargetAtTime(on?(.03+thr*.035+(nitroOn?.03:0)):0,t,.08);
 const slip=on&&v>2.4&&Math.abs(steerS)>.55?Math.min(1,(v-2.4)/2):0;sq.g.gain.setTargetAtTime(slip*.06,t,.05);sq.fl.frequency.setTargetAtTime(2200+v*120,t,.1);nit.g.gain.setTargetAtTime(on&&nitroOn?.1:0,t,.05);nit.fl.frequency.setTargetAtTime(500+v*160,t,.08);
 if(on&&time<=10&&Math.ceil(time)!==lastTick){lastTick=Math.ceil(time);sfx.tick()}}
function toggleMute(){muted=!muted;if(muted&&window.speechSynthesis)speechSynthesis.cancel();document.getElementById('bm').textContent=muted?'\ud83d\udd07':'\ud83d\udd0a'}

const steerVal=()=>Math.max(-1,Math.min(1,keys.right-keys.left+steerA));
const LAYOUTS=['Classic rows','Two long rows','Zig-zag','Horseshoe','Group tables','Two blocks'];
function buildDesks(l){desks=[];const v=l%6,D=(x,y)=>desks.push({x,y,w:120,h:60});
 if(v===0)for(let j=0;j<3;j++)for(let i=0;i<3;i++)D(150+i*260,120+j*150);
 else if(v===1)for(let j=0;j<2;j++)for(let i=0;i<4;i++)D(60+i*210,150+j*220);
 else if(v===2)for(let j=0;j<3;j++)for(let i=0;i<3;i++)D((j===1?170:110)+i*260,120+j*150);
 else if(v===3){for(let i=0;i<5;i++)D(100+i*160,130);[250,370].forEach(y=>{D(100,y);D(740,y)})}
 else if(v===4)for(let j=0;j<2;j++)for(let i=0;i<3;i++){D(40+i*290,140+j*200);D(160+i*290,140+j*200)}
 else for(let j=0;j<3;j++)[40,160,620,740].forEach(x=>D(x,120+j*120))}
function blocked(x1,y1,x2,y2){const n=Math.ceil(Math.hypot(x2-x1,y2-y1)/12);for(let i=1;i<n;i++){const x=x1+(x2-x1)*i/n,y=y1+(y2-y1)*i/n;if(desks.some(d=>x>d.x&&x<d.x+d.w&&y>d.y&&y<d.y+d.h))return true}return false}

function previewVoice(id){
 const pack=packs[id]||BUILTIN_VOICE_PACKS[id];
 if(!pack)return;
 const phrase=id==='ja'?'ちょっと！待ちなさい！そのおもちゃをゴミ箱に捨てるわよ！':'Hey! Stop right there! That toy is going in the trash!';
 popups.push({t:'🔊 '+(id==='ja'?'Sensi [JA]: ':'Sensi [EN]: ')+phrase,x:480,y:230,l:2.8,s:1,c:'#ffd23f'});
 const ss=window.speechSynthesis;
 if(!ss){blip(phrase,120);return}
 try{
  ss.cancel();
  const u=new SpeechSynthesisUtterance(phrase);
  u.lang=pack.lang||(id==='ja'?'ja-JP':'en-US');
  u.pitch=(pack.teacher&&pack.teacher.pitch)||(id==='ja'?1.15:0.85);
  u.rate=(pack.teacher&&pack.teacher.rate)||1.0;
  u.volume=1.0;
  if(VO&&VO.length){
   const pool=VO.filter(v=>v.lang.toLowerCase().startsWith(u.lang.slice(0,2)));
   const fem=pool.filter(v=>/female|zira|samantha|susan|hazel|karen|moira|aria|jenny|kyoko|haruka|nanami|google uk english female|google us english|google 日本語/i.test(v.name));
   u.voice=fem[0]||pool[0]||null;
  }
  ss.speak(u);
 }catch(e){blip(phrase,120)}
}
