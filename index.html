<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>Class Dismissed RC</title>
<style>
:root{--bg:#2b2a33;--ink:#f3efe0;--btn:#e8b53a;--btnink:#2b2a33}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",Verdana,sans-serif;touch-action:none;user-select:none}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:8px}
canvas{width:100%;max-width:960px;height:auto;aspect-ratio:960/520;border-radius:8px;background:#000}
#pad{display:flex;justify-content:space-between;align-items:flex-end;width:100%;max-width:960px}
#steer{display:flex;gap:12px}
#steer button{width:84px;height:84px;border:0;border-radius:18px;background:var(--btn);color:var(--btnink);font-size:34px;font-weight:bold}
#steer button.on{filter:brightness(.8);transform:translateY(2px)}
#ped{display:flex;flex-direction:column;gap:10px}
#ped button{width:120px;border:0;border-radius:14px;background:var(--btn);color:var(--btnink);font-weight:bold;font-size:18px}
#ped button[data-k=up]{height:84px}#ped button[data-k=down]{height:52px;background:#b86a50;color:#fff}
#ped button.on{filter:brightness(.8);transform:translateY(2px)}
#bar{display:flex;gap:8px;width:100%;max-width:960px;justify-content:flex-end}
#bar button{border:0;border-radius:10px;background:#444;color:#fff;font-size:18px;padding:4px 12px}
button{transition:transform .08s ease,filter .15s,box-shadow .2s;-webkit-user-select:none}
#steer button,#ped button{box-shadow:0 5px 0 rgba(0,0,0,.35),0 8px 14px rgba(0,0,0,.35)}
#steer button.on,#ped button.on{box-shadow:0 1px 0 rgba(0,0,0,.35),0 0 18px rgba(232,181,58,.55);transform:translateY(4px) scale(.97)}
canvas{box-shadow:0 8px 30px rgba(0,0,0,.5)}
@media (prefers-reduced-motion:reduce){button{transition:none}}
#rot{display:none;position:fixed;inset:0;z-index:99;background:#2b2a33;color:#f3efe0;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-size:20px;text-align:center;padding:24px}
#rot b{font-size:56px;display:block;animation:rt 1.6s ease-in-out infinite}
@keyframes rt{0%,30%{transform:rotate(0)}70%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (pointer:coarse){#rot{display:flex}}
@media (orientation:landscape) and (pointer:coarse){
 body{padding:0;gap:0;height:100dvh;overflow:hidden}
 canvas{width:min(100vw,calc(100dvh*960/520));max-width:none;border-radius:0;box-shadow:none}
 #pad{position:fixed;left:max(14px,env(safe-area-inset-left));right:max(14px,env(safe-area-inset-right));bottom:12px;width:auto;max-width:none;pointer-events:none}
 #pad button{pointer-events:auto;opacity:.82}
 #steer button{width:78px;height:78px}
 #ped button{width:104px}#ped button[data-k=up]{height:74px}#ped button[data-k=down]{height:46px}
 #bar{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);width:auto;z-index:5}
 #bar button{opacity:.75}
}
@media (hover:hover) and (pointer:fine){#pad{display:none}}
</style>
</head>
<body>
<div id="bar"><button id="bs" hidden>Invite</button><button id="bl" hidden>Leave</button><button id="bp">⏸</button><button id="bm">🔊</button></div>
<div id="rot"><b>📱</b>Rotate your phone to landscape to play</div>
<canvas id="c" width="960" height="520"></canvas>
<div id="pad"><div id="steer"><button data-k="left">◀</button><button data-k="right">▶</button></div><div id="ped"><button data-k="up">GAS</button><button data-k="down">REVERSE</button></div></div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');
const WW=900,WH=600,OX=30,OY=130,SY=0.6,DH=30;
const P=(x,y,z=0)=>[x+OX,y*SY+OY-z];
const keys={up:0,down:0,left:0,right:0};
const map={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'};
let state='ready',score=0,time=45,bumps=0,bumpCd=0,best=0,msg='';
try{best=+localStorage.getItem('rcBest')||0}catch(e){}
let desks=[];buildDesks(0);
const car={x:450,y:560,a:-Math.PI/2,v:0,r:11};
let level=1,diff=1,combo=0,comboT=0,shake=0,skids=[],powers=[],clutter=[],pTimer=5,collected=0,steerA=0,popups=[],tops=[];
try{tops=JSON.parse(localStorage.getItem('rcTop')||'[]')}catch(e){}
const DIFF=[{n:'Easy',t:55,s:.85},{n:'Normal',t:45,s:1},{n:'Hard',t:38,s:1.2}];
const ui={diff:false,dy:0,py:0,my:-99};
let NG=false,NH=false,peer=null,hostConn=null,conns=[],remote={},room='',netStatus='',myId='',nAcc=0;
let AC=null,eng=null,muted=false;
function goLand(){if(!matchMedia('(pointer:coarse)').matches)return;try{const d=document.documentElement;Promise.resolve(d.requestFullscreen&&d.requestFullscreen()).then(()=>screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape')).catch(()=>{})}catch(e){}}
function audioInit(){if(AC){AC.resume&&AC.resume();return}try{AC=new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),gn=AC.createGain();o.type='sawtooth';o.frequency.value=60;gn.gain.value=0;o.connect(gn);gn.connect(AC.destination);o.start();eng={o,gn}}catch(e){}}
function tone(f,d=.12,type='sine',vol=.15,f2){if(!AC||muted)return;const o=AC.createOscillator(),gn=AC.createGain(),t=AC.currentTime;o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);gn.gain.setValueAtTime(vol,t);gn.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(gn);gn.connect(AC.destination);o.start(t);o.stop(t+d)}
const sfx={pick:()=>tone(880,.1,'sine',.15,1320),bump:()=>tone(140,.18,'square',.2,50),
 power:()=>[523,659,784].forEach((f,i)=>setTimeout(()=>tone(f,.12,'triangle',.18),i*80)),
 alert:()=>{tone(1500,.15,'square',.1,1100);setTimeout(()=>tone(1500,.15,'square',.1,1100),180)},
 bell:()=>[0,1,2,3].forEach(i=>setTimeout(()=>tone(1250,.35,'triangle',.25),i*320))};
function engine(){if(!eng)return;eng.gn.gain.value=(state==='play'&&!muted)?.025:0;eng.o.frequency.value=55+Math.abs(car.v)*22+(keys.up?12:0)}
function toggleMute(){muted=!muted;document.getElementById('bm').textContent=muted?'\ud83d\udd07':'\ud83d\udd0a'}
function togglePause(){if(NH||NG)return;if(state==='play')state='pause';else if(state==='pause')state='play'}
const steerVal=()=>Math.max(-1,Math.min(1,keys.right-keys.left+steerA));
function buildDesks(l){desks=[];const v=l%3;
 if(v===1){for(let j=0;j<2;j++)for(let i=0;i<4;i++)desks.push({x:60+i*210,y:150+j*220,w:120,h:60})}
 else for(let j=0;j<3;j++)for(let i=0;i<3;i++)desks.push({x:(v===2&&j===1?170:110)+(v===0?40:0)+i*260,y:120+j*150,w:120,h:60})}
function blocked(x1,y1,x2,y2){const n=Math.ceil(Math.hypot(x2-x1,y2-y1)/12);for(let i=1;i<n;i++){const x=x1+(x2-x1)*i/n,y=y1+(y2-y1)*i/n;if(desks.some(d=>x>d.x&&x<d.x+d.w&&y>d.y&&y<d.y+d.h))return true}return false}
function pushHit(o,r){let h=false;for(const d of desks){const cx=Math.max(d.x,Math.min(o.x,d.x+d.w)),cy=Math.max(d.y,Math.min(o.y,d.y+d.h));let dx=o.x-cx,dy=o.y-cy,dist=Math.hypot(dx,dy);if(dist<r){if(dist===0){dx=0;dy=-1;dist=1}o.x+=dx/dist*(r-dist);o.y+=dy/dist*(r-dist);h=true}}return h}
function hit(pen,mul,any){if(bumpCd===0&&(any||Math.abs(car.v)>1.2)){bumps++;bumpCd=.4;if(NG)sendH(pen);else{time=Math.max(0,time-pen);combo=0}shake=RM?0:7;flash=.35;burst(car.x,car.y,6,8,'#d9ccb0',2);sfx.bump();navigator.vibrate&&navigator.vibrate(40)}car.v*=mul}
function setupClutter(){clutter=[];for(let i=0;i<Math.min(8,3+level);i++){let x,y;do{x=40+Math.random()*820;y=40+Math.random()*520}while(!free(x,y)||Math.hypot(x-450,y-560)<90);clutter.push({x,y,r:i%2?7:9,k:i%2?'ball':'bag',c:['#d6513f','#3a7bd5','#3fa66b'][i%3]})}}
let steerS=0,dispScore=0,dispTime=45,pa=0,ea=1,flash=0,parts=[],camX=0,camY=0,lastSt='';
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
function burst(x,y,z,n,col,sp=1.5){if(RM)return;for(let i=0;i<n;i++){const a=Math.random()*6.28;parts.push({x,y,z,vx:Math.cos(a)*sp*Math.random(),vy:Math.sin(a)*sp*Math.random(),vz:1+Math.random()*2,l:1,c:col})}}
const lanes=[60,225,375,525];
let students=[],teacher={};
function initChars(){
 const L=[];for(let y=40;y<=580;y+=20)if(!desks.some(d=>y+16>d.y&&y-16<d.y+d.h))L.push(y);
 const n=Math.min(7,2+level),cols=['#3a7bd5','#e0a526','#3fa66b','#9b59b6','#d6513f','#2aa3a3','#e07aa0'],hcs=['#2a1a10','#6b3a1a','#c9a227','#111'];
 students=[];for(let i=0;i<n;i++){const y=L[Math.floor((i+.5)*L.length/n)];let x=60+Math.random()*780;if(y>500&&Math.abs(x-450)<120)x=(x+300)%780+60;
  students.push({x,y,dir:i%2?1:-1,sp:.9+Math.random()*.7+level*.05,col:cols[i%7],t:i,hc:hcs[i%4]})}
 teacher={x:80,y:60,sp:1.7+level*.12,t:0,alert:0,wp:null,freeze:0,say:'',sayT:0,delay:2,lx:0,ly:0};
}
function end(m){if(state==='over')return;msg=m;state='over';sfx.bell();
 tops.push({s:score,l:level});tops.sort((a,b)=>b.s-a.s);tops=tops.slice(0,5);try{localStorage.setItem('rcTop',JSON.stringify(tops))}catch(e){}}
function pushOut(o,r){
 for(const d of desks){
  const cx=Math.max(d.x,Math.min(o.x,d.x+d.w)),cy=Math.max(d.y,Math.min(o.y,d.y+d.h));
  let dx=o.x-cx,dy=o.y-cy,dist=Math.hypot(dx,dy);
  if(dist<r){if(dist===0){dx=0;dy=-1;dist=1}o.x+=dx/dist*(r-dist);o.y+=dy/dist*(r-dist)}
 }
}
let papers=[];
function free(x,y){return !desks.some(d=>x>d.x-20&&x<d.x+d.w+20&&y>d.y-20&&y<d.y+d.h+20)}
function spawn(){let x,y;do{x=40+Math.random()*(WW-80);y=40+Math.random()*(WH-80)}while(!free(x,y));papers.push({x,y,t:Math.random()*6})}
function reset(){audioInit();goLand();steerS=0;dispScore=0;level=1;score=0;collected=0;combo=0;bumps=0;time=DIFF[diff].t;car.boost=0;skids=[];powers=[];pTimer=5;popups=[];msg='';nextLevel(true);state='play'}
function nextLevel(first){buildDesks(level-1);car.x=450;car.y=560;car.a=-Math.PI/2;car.v=0;initChars();setupClutter();papers=[];for(let i=0;i<5;i++)spawn();
 if(!first){time+=10;sfx.power();popups.push({t:'Level '+level,x:480,y:230,l:2,s:1})}}
addEventListener('keydown',e=>{const k=map[e.key];if(k){keys[k]=1;e.preventDefault()}
 if(e.key==='p'||e.key==='Escape')togglePause();if(e.key==='m')toggleMute();
 const go=e.key===' '||e.key==='Enter';
 if(state==='pause'&&go)state='play';else if(state!=='play'&&state!=='pause'&&go&&!NG)reset();
 if(state==='ready'&&'123'.includes(e.key))diff=+e.key-1});
addEventListener('keyup',e=>{const k=map[e.key];if(k)keys[k]=0});
document.querySelectorAll('#pad button').forEach(b=>{const k=b.dataset.k;
 const on=e=>{e.preventDefault();keys[k]=1;b.classList.add('on')},off=e=>{e.preventDefault();keys[k]=0;b.classList.remove('on')};
 b.addEventListener('pointerdown',on);['pointerup','pointerleave','pointercancel'].forEach(t=>b.addEventListener(t,off))});
cv.addEventListener('pointerdown',e=>{audioInit();if(state==='play'||NG)return;
 const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*960/r.width,y=(e.clientY-r.top)*520/r.height;
 if(ui.diff&&y>ui.dy&&y<ui.dy+34&&x>290&&x<680){diff=Math.max(0,Math.min(2,Math.floor((x-290)/130)));return}
 if(ui.my>0&&y>ui.my&&y<ui.my+32){if(x>290&&x<470)hostRoom();else if(x>490&&x<670)joinRoom();return}
 if(x>380&&x<580&&y>ui.py&&y<ui.py+40){if(state==='pause')state='play';else reset()}});

document.getElementById('bp').onclick=function(){togglePause();this.blur()};
document.getElementById('bm').onclick=function(){toggleMute();this.blur()};

function update(dt){
 if(state!=='play')return;
 if(!NG){time-=dt;if(time<=0){time=0;end('')}}
 bumpCd=Math.max(0,bumpCd-dt);shake=Math.max(0,shake-dt*30);comboT-=dt;if(comboT<=0)combo=0;
 popups.forEach(p=>p.l-=dt);popups=popups.filter(p=>p.l>0);
 car.boost=Math.max(0,(car.boost||0)-dt);
 const bst=car.boost>0;
 if(keys.up)car.v+=bst?.34:.22;if(keys.down)car.v-=.18;
 car.v*=.975;car.v=Math.max(-2.2,Math.min(bst?6.4:4.6,car.v));
 steerS+=(steerVal()-steerS)*Math.min(1,dt*9);const sv=steerS;car.a+=sv*.052*Math.max(-1,Math.min(1,car.v/2));
 car.x+=Math.cos(car.a)*car.v;car.y+=Math.sin(car.a)*car.v;
 car.x=Math.max(car.r,Math.min(WW-car.r,car.x));car.y=Math.max(car.r,Math.min(WH-car.r,car.y));
 if(Math.abs(car.v)>2.4&&Math.abs(sv)>.55){[-9,9].forEach(w=>skids.push({x:car.x-Math.cos(car.a)*9-Math.sin(car.a)*w,y:car.y-Math.sin(car.a)*9+Math.cos(car.a)*w,l:1}));if(skids.length>300)skids.splice(0,2)}
 skids.forEach(k=>k.l-=dt*.25);skids=skids.filter(k=>k.l>0);
 flash=Math.max(0,flash-dt*3);
 if(Math.abs(car.v)>3&&Math.random()<.5)burst(car.x-Math.cos(car.a)*14,car.y-Math.sin(car.a)*14,3,1,car.boost>0?'#ffb02e':'#d9ccb0',.6);
 parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.z+=p.vz;p.vz-=.18;if(p.z<0){p.z=0;p.vz*=-.3}p.l-=dt*1.6});parts=parts.filter(p=>p.l>0);
 if(pushHit(car,car.r))hit(1,-.3);
 for(const c of clutter){let dx=car.x-c.x,dy=car.y-c.y,d=Math.hypot(dx,dy)||1;if(d<car.r+c.r){car.x+=dx/d*(car.r+c.r-d);car.y+=dy/d*(car.r+c.r-d);if(c.k==='bag')hit(1,-.3);else car.v*=.6}}
 for(const st of students){st.x+=st.dir*st.sp;if(st.x<40||st.x>860)st.dir*=-1;st.t+=dt*8;
  let dx=car.x-st.x,dy=car.y-st.y,d=Math.hypot(dx,dy);
  if(d<car.r+10){if(d===0){dx=0;dy=1;d=1}car.x+=dx/d*(car.r+10-d);car.y+=dy/d*(car.r+10-d);hit(2,-.4,true)}}
 const T=teacher;T.sayT-=dt;T.t+=dt*10;
 if(NG){if(T.tx!==undefined){T.x+=(T.tx-T.x)*.3;T.y+=(T.ty-T.y)*.3}}
 else if(T.freeze>0)T.freeze-=dt;
 else if(T.delay>0)T.delay-=dt;
 else{
  const tc=nearest(T.x,T.y),dx=tc.x-T.x,dy=tc.y-T.y,d=Math.hypot(dx,dy)||1,D=DIFF[diff];
  if(d<300*D.s&&!blocked(T.x,T.y,tc.x,tc.y)){if(T.alert<=0){T.say='Hey! Stop right there!';T.sayT=1.8;sfx.alert()}T.alert=2.5;T.lx=tc.x;T.ly=tc.y}else T.alert-=dt;
  let tx,ty,sp;
  if(T.alert>0){tx=T.lx;ty=T.ly;T.sp=Math.min(3.3,T.sp+dt*.05);sp=T.sp*D.s}
  else{if(!T.wp||Math.hypot(T.wp[0]-T.x,T.wp[1]-T.y)<15){let x,y;do{x=40+Math.random()*820;y=40+Math.random()*520}while(!free(x,y));T.wp=[x,y]}
   tx=T.wp[0];ty=T.wp[1];sp=1;
   if(T.sayT<=0&&Math.random()<dt*.15){T.say=['No running in class!','Slow down!','Homework, please!'][Math.floor(Math.random()*3)];T.sayT=1.8}}
  const ex=tx-T.x,ey=ty-T.y,ed=Math.hypot(ex,ey)||1;if(ed>3){T.x+=ex/ed*sp;T.y+=ey/ed*sp}
  pushHit(T,13);
  if(d<25)end('caught');
 }
 if(NG){papers.forEach(p=>p.t+=dt*3);powers.forEach(p=>p.t+=dt*3);return}
 pTimer-=dt;
 if(pTimer<=0&&powers.length<2){pTimer=7+Math.random()*4;let x,y;do{x=40+Math.random()*820;y=40+Math.random()*520}while(!free(x,y));powers.push({x,y,k:['coffee','eraser','clock'][Math.floor(Math.random()*3)],t:0})}
 papers.forEach(p=>p.t+=dt*3);powers.forEach(p=>p.t+=dt*3);
 for(const c of allCars()){
  for(let i=0;i<powers.length;i++){const p=powers[i];
   if(Math.hypot(p.x-c.x,p.y-c.y)<car.r+14){powers.splice(i,1);sfx.power();burst(p.x,p.y,12,12,'#8fd16b',2.5);
    let m;if(p.k==='coffee'){if(c===car)car.boost=5;else toPeer(c.id,{t:'b'});m='Speed boost!'}
    else if(p.k==='eraser'){teacher.freeze=3;m='Teacher frozen!'}else{time+=8;m='+8 seconds'}
    popups.push({t:m,x:480,y:200,l:1.5,s:1});break}}
  for(let i=0;i<papers.length;i++){const p=papers[i];
   if(Math.hypot(p.x-c.x,p.y-c.y)<car.r+12){papers.splice(i,1);combo=comboT>0?combo+1:1;comboT=3;
    const pts=Math.min(5,combo);score+=pts;collected++;time=Math.min(70,time+1.5);sfx.pick();burst(p.x,p.y,12,10,'#ffd23f',2);
    popups.push({t:'+'+pts+(combo>1?' x'+combo:''),x:p.x,y:p.y,l:1});
    if(collected%7===0){level++;nextLevel(false);return}
    spawn();break}}
 }
}
function poly(pts,fill){g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();g.fillStyle=fill;g.fill()}
function box(c,h,top,side,dark,z0=0){
 for(let i=0;i<4;i++){const a=c[i],b=c[(i+1)%4];
  if(b[0]-a[0]>0.001)poly([P(a[0],a[1],z0),P(b[0],b[1],z0),P(b[0],b[1],h),P(a[0],a[1],h)],i%2?dark:side)}
 poly(c.map(q=>P(q[0],q[1],h)),top);
}
function drawDesk(d){
 for(let k=0;k<3;k++){g.fillStyle='rgba(0,0,0,.09)';g.fillRect(...P(d.x+4+k*5,d.y+4+k*3),d.w+6-k,d.h*SY+2)}
 [[4,4],[d.w-8,4],[4,d.h-8],[d.w-8,d.h-8]].forEach(([ox,oy])=>{const x=d.x+ox,y=d.y+oy;
  box([[x,y],[x+4,y],[x+4,y+4],[x,y+4]],28,'#7b808a','#5d626b','#454951')});
 box([[d.x,d.y],[d.x+d.w,d.y],[d.x+d.w,d.y+d.h],[d.x,d.y+d.h]],33,'#d8a35a','#a9732f','#8c5f25',28);
 g.strokeStyle='rgba(120,70,20,.28)';g.lineWidth=1;
 for(let k=1;k<5;k++){g.beginPath();g.moveTo(...P(d.x+4,d.y+k*d.h/5,33));g.lineTo(...P(d.x+d.w-4,d.y+k*d.h/5,33));g.stroke()}
 g.strokeStyle='rgba(255,230,170,.55)';g.beginPath();g.moveTo(...P(d.x,d.y+d.h,33));g.lineTo(...P(d.x+d.w,d.y+d.h,33));g.stroke();
 const T=(pts,f)=>poly(pts.map(q=>P(q[0],q[1],33)),f);
 T([[d.x+14,d.y+14],[d.x+36,d.y+14],[d.x+36,d.y+42],[d.x+14,d.y+42]],'#f6f2e4');

const COLS=['#3a7bd5','#3fa66b','#e0a526','#9b59b6','#2aa3a3'];
const allCars=()=>[car,...Object.entries(remote).map(([id,r])=>(r.id=id,r))];
function nearest(x,y){let b=car,bd=1e9;for(const c of allCars()){const d=Math.hypot(c.x-x,c.y-y);if(d<bd){bd=d;b=c}}return b}
function toPeer(id,m){const c=conns.find(k=>k.peer===id);if(c&&c.open)c.send(m)}
function sendH(p){if(hostConn&&hostConn.open)hostConn.send({t:'h',p})}
function setNetUI(){document.getElementById('bs').hidden=!NH;document.getElementById('bl').hidden=!(NH||NG)}
function loadPeer(cb){if(window.Peer)return cb();const sc=document.createElement('script');sc.src='https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';sc.onload=cb;
 sc.onerror=()=>popups.push({t:'Could not load multiplayer',x:480,y:200,l:2.5,s:1});document.head.appendChild(sc)}
function leave(m){try{peer&&peer.destroy()}catch(e){}peer=null;hostConn=null;NH=NG=false;conns=[];remote={};netStatus='';room='';state='ready';setNetUI();if(m)popups.push({t:m,x:480,y:200,l:2.5,s:1})}
function hostRoom(){if(peer)return;loadPeer(()=>{const code=Math.random().toString(36).slice(2,6).toUpperCase(),p=new Peer('rccg-'+code);peer=p;
 p.on('open',()=>{room=code;NH=true;NG=false;netStatus='Room '+code;setNetUI();reset()});
 p.on('error',e=>{if(e.type==='unavailable-id'){p.destroy();peer=null;hostRoom()}else leave('Network error')});
 p.on('connection',c=>{
  c.on('open',()=>{conns.push(c);remote[c.peer]={x:450,y:560,a:-1.57,v:0,col:COLS[conns.length%5],name:'P'+(conns.length+1)}});
  c.on('data',d=>{const r=remote[c.peer];if(!r)return;if(d.t==='c'){r.x=d.x;r.y=d.y;r.a=d.a;r.v=d.v}else if(d.t==='h'&&state==='play'){time=Math.max(0,time-d.p);combo=0}});
  c.on('close',()=>{delete remote[c.peer];conns=conns.filter(k=>k!==c)})})})}
function joinRoom(code){code=(code||prompt('Enter room code')||'').trim().toUpperCase();if(!code||peer)return;
 loadPeer(()=>{const p=new Peer();peer=p;
  p.on('open',id=>{myId=id;const c=p.connect('rccg-'+code);hostConn=c;
   c.on('open',()=>{NG=true;NH=false;room=code;netStatus='Room '+code;setNetUI();audioInit();state='play';car.x=430+Math.random()*40;car.y=560;car.a=-1.57;car.v=0;steerS=0});
   c.on('data',d=>{if(d.t==='b'){car.boost=5;popups.push({t:'Speed boost!',x:480,y:200,l:1.5,s:1})}else onSnap(d)});
   c.on('close',()=>leave('Host left the room'))});
  p.on('error',()=>{if(!NG)leave('Could not join room')})})}
function snap(){return{t:'s',st:state==='pause'?'play':state,lv:level,time,score,cb:combo,cT:comboT,msg,
 cars:[['host',car.x,car.y,car.a,car.v,'#e8452f','Host'],...Object.entries(remote).map(([id,r])=>[id,r.x,r.y,r.a,r.v,r.col,r.name])],
 T:{alert:teacher.alert,freeze:teacher.freeze,say:teacher.say,sayT:teacher.sayT,tx:teacher.x,ty:teacher.y},
 stu:students.map(o=>[Math.round(o.x),Math.round(o.y),o.dir,o.col,o.hc,o.sp]),
 pap:papers.map(p=>[Math.round(p.x),Math.round(p.y)]),pw:powers.map(p=>[Math.round(p.x),Math.round(p.y),p.k]),
 cl:clutter.map(c=>[Math.round(c.x),Math.round(c.y),c.r,c.k==='bag'?1:0,c.c])}}
function onSnap(d){if(d.t!=='s')return;
 if(d.lv!==level){level=d.lv;buildDesks(level-1);if(state==='play')popups.push({t:'Level '+level,x:480,y:230,l:2,s:1})}
 if(d.st==='over'&&state!=='over')sfx.bell();
 state=d.st;time=d.time;score=d.score;combo=d.cb;comboT=d.cT;msg=d.msg;
 Object.assign(teacher,d.T);if(teacher.x===undefined){teacher.x=d.T.tx;teacher.y=d.T.ty}
 students=d.stu.map((a,i)=>({x:a[0],y:a[1],dir:a[2],col:a[3],hc:a[4],sp:a[5],t:students[i]?students[i].t:i}));
 papers=d.pap.map((a,i)=>({x:a[0],y:a[1],t:papers[i]?papers[i].t:i}));
 powers=d.pw.map((a,i)=>({x:a[0],y:a[1],k:a[2],t:powers[i]?powers[i].t:0}));
 clutter=d.cl.map(a=>({x:a[0],y:a[1],r:a[2],k:a[3]?'bag':'ball',c:a[4]}));
 const seen={};d.cars.forEach(a=>{if(a[0]===myId)return;seen[a[0]]=1;remote[a[0]]=Object.assign(remote[a[0]]||{},{x:a[1],y:a[2],a:a[3],v:a[4],col:a[5],name:a[6]})});
 for(const k in remote)if(!seen[k])delete remote[k]}
function drawOther(r){r.rx=r.rx===undefined?r.x:r.rx+(r.x-r.rx)*.4;r.ry=r.ry===undefined?r.y:r.ry+(r.y-r.ry)*.4;
 const sv={x:car.x,y:car.y,a:car.a,v:car.v};car.x=r.rx;car.y=r.ry;car.a=r.a;car.v=r.v;
 const p=P(r.rx,r.ry);g.strokeStyle=r.col;g.lineWidth=3;g.beginPath();g.ellipse(p[0],p[1],20,9,0,0,7);g.stroke();
 drawCar();Object.assign(car,sv);
 g.font='bold 12px "Trebuchet MS",sans-serif';g.textAlign='center';g.fillStyle=r.col;g.fillText(r.name||'P',p[0],p[1]-36);g.textAlign='left'}
function netTick(dt){
 if(state!=='play'){popups.forEach(p=>p.l-=dt);popups=popups.filter(p=>p.l>0)}
 nAcc+=dt;if(nAcc<.05)return;nAcc=0;
 if(NH&&conns.length){const m=snap();conns.forEach(c=>c.open&&c.send(m))}
 else if(NG&&hostConn&&hostConn.open)hostConn.send({t:'c',x:car.x,y:car.y,a:car.a,v:car.v})}
document.getElementById('bl').onclick=function(){leave('Left room')};
document.getElementById('bs').onclick=function(){const u=location.href.split('?')[0]+'?room='+room;
 if(navigator.share)navigator.share({title:'Class Dismissed RC',text:'Join my room: '+room,url:u}).catch(()=>{});
 else{navigator.clipboard&&navigator.clipboard.writeText(u);popups.push({t:'Link copied',x:480,y:200,l:1.5,s:1})}this.blur()};
const qRoom=new URLSearchParams(location.search).get('room');
if(qRoom)joinRoom(qRoom);
buildRoom();
let last=performance.now();
(function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;update(dt);netTick(dt);engine();draw();requestAnimationFrame(loop)})(last);
</script>
</body>
